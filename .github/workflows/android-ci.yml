name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 (AGP 9.4 requiere 17+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle con caché
        uses: gradle/actions/setup-gradle@v4

      - name: Validar catálogo de preguntas
        run: python3 scripts/validar_preguntas.py content/preguntas.json

      - name: Build debug APK (todos los módulos)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitarios
        run: ./gradlew test --stacktrace

      - name: Subir APK debug como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cerlita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
